# FILE 8: application.properties
# Webswing configuration for Auralis (WAV + MP3 support)

auralis.name=Auralis
auralis.path=auralis
auralis.mainClass=com.auralis.AuralisApp

# Include main JAR + MP3 support libraries
# Windows separator: ;
# Mac/Linux separator: :
auralis.classPath=../auralis-app/target/Auralis.jar;../auralis-app/lib/jlayer-1.0.1.jar;../auralis-app/lib/mp3spi-1.9.5.4.jar;../auralis-app/lib/tritonus-share-0.3.7-2.jar

auralis.jvmArgs=-Xmx512m -Xms256m
auralis.homeDir=../auralis-app
auralis.enabled=true
